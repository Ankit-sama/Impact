# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/impact
spring.datasource.username=postgres
spring.datasource.password=12345
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# impACT Custom Properties (Spec 5.4)
impact.scheduler.interval-seconds=5
impact.event.min-duration-minutes=3
impact.event.max-duration-days=30
impact.event.readiness-window-minutes=2
impact.proof.creator-window-minutes=3
impact.proof.resubmit-window-minutes=3
impact.workforce.threshold-percent=80
impact.similarity.window-days=7
impact.upload.dir=./uploads