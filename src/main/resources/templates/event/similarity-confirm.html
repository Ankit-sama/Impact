<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Confirm Publishing - impACT')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="d-flex align-items-center mb-4">
                <button type="button" class="btn btn-outline-secondary btn-sm me-3" onclick="history.back()"><i class="bi bi-arrow-left"></i> Back</button>
                <h3 class="mb-0">Publishing Warning</h3>
            </div>
            
            <div class="alert alert-warning border-warning shadow-sm">
                <h4 class="alert-heading"><i class="bi bi-exclamation-triangle"></i> Similar Events Detected</h4>
                <p>We found published events that are very similar to yours (same category, same city, starting within 7 days). Publishing duplicate events can split volunteer attendance.</p>
                <hr>
                <div th:each="sim : ${similarEvents}" class="mb-3 p-3 bg-white rounded border">
                    <h5 class="mb-1" th:text="${sim.title}">Event Title</h5>
                    <p class="mb-1 text-muted small">
                        <strong>Category:</strong> <span th:text="${sim.category.displayName}"></span> | 
                        <strong>City:</strong> <span th:text="${sim.city}"></span>
                    </p>
                    <p class="mb-0 text-muted small">
                        <strong>Starts:</strong> <span th:text="${#temporals.format(sim.startAt, 'dd MMM yyyy, HH:mm')}"></span>
                    </p>
                </div>
                
                <div class="d-flex justify-content-end gap-2 mt-4">
                    <button type="button" class="btn btn-secondary" onclick="history.back()">Go Back</button>
                    <form th:action="@{/events/{id}/publish/force(id=${event.id})}" method="post">
                        <button type="submit" class="btn btn-warning fw-bold">Publish Anyway</button>
                    </form>
                </div>
            </div>
            
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
