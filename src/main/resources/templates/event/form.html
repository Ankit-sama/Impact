<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header(${eventDto.id == null ? 'Create Event - impACT' : 'Edit Event - impACT'})}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="d-flex align-items-center mb-4">
                <button type="button" class="btn btn-outline-secondary btn-sm me-3" onclick="history.back()"><i class="bi bi-arrow-left"></i> Back</button>
                <h3 class="mb-0" th:text="${eventDto.id == null ? 'Create New Event' : 'Edit Draft Event'}"></h3>
            </div>
            
            <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <form th:action="${eventDto.id == null ? '/events/create' : '/events/' + eventDto.id + '/edit'}" th:object="${eventDto}" method="post">
                        
                        <h5 class="mb-3 border-bottom pb-2">Basic Details</h5>
                        <div class="mb-3">
                            <label class="form-label">Event Title</label>
                            <input type="text" class="form-control" th:field="*{title}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <select class="form-select" th:field="*{category}">
                                <option value="" disabled selected>Select a category...</option>
                                <option th:each="cat : ${categories}" th:value="${cat.name()}" th:text="${cat.displayName}"></option>
                            </select>
                            <div class="text-danger small" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Purpose / Description</label>
                            <textarea class="form-control" rows="4" th:field="*{purpose}"></textarea>
                            <div class="text-danger small" th:if="${#fields.hasErrors('purpose')}" th:errors="*{purpose}"></div>
                        </div>

                        <h5 class="mb-3 border-bottom pb-2">Schedule & Time</h5>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Start Time</label>
                                <input type="datetime-local" class="form-control" th:field="*{startAtLocal}">
                                <div class="text-danger small" th:if="${#fields.hasErrors('startAtLocal')}" th:errors="*{startAtLocal}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">End Time</label>
                                <input type="datetime-local" class="form-control" th:field="*{endAtLocal}">
                                <div class="text-danger small" th:if="${#fields.hasErrors('endAtLocal')}" th:errors="*{endAtLocal}"></div>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Expected Volunteer Hours (per person)</label>
                            <input type="number" class="form-control" th:field="*{expectedHours}" min="1">
                            <div class="text-danger small" th:if="${#fields.hasErrors('expectedHours')}" th:errors="*{expectedHours}"></div>
                        </div>

                        <h5 class="mb-3 border-bottom pb-2">Location & Capacity</h5>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">City</label>
                                <input type="text" class="form-control" th:field="*{city}">
                                <div class="text-danger small" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">State</label>
                                <input type="text" class="form-control" th:field="*{state}">
                                <div class="text-danger small" th:if="${#fields.hasErrors('state')}" th:errors="*{state}"></div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Specific Address (Optional)</label>
                            <input type="text" class="form-control" th:field="*{address}">
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Number of volunteers needed</label>
                            <input type="number" class="form-control" th:field="*{capacity}" min="1">
                            <div class="text-danger small" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}"></div>
                        </div>

                        <div class="d-flex justify-content-end mt-4">
                            <button type="submit" class="btn btn-primary" th:text="${eventDto.id == null ? 'Save Draft' : 'Update Draft'}">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
