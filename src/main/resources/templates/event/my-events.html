<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('My Events - impACT')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mb-5">
    <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>
    <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>My Created Events</h2>
        <a th:href="@{/events/create}" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Create Event</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Title</th>
                        <th>Date</th>
                        <th>City</th>
                        <th>Status</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody class="live-update" id="my-events-tbody">
                    <tr th:each="event : ${events}">
                        <td class="align-middle fw-semibold" th:text="${event.title}"></td>
                        <td class="align-middle" th:text="${#temporals.format(event.startAt, 'dd MMM yyyy')}"></td>
                        <td class="align-middle" th:text="${event.city}"></td>
                        <td class="align-middle">
                            <div th:replace="~{fragments/layout :: eventStatus(event=${event})}"></div>
                        </td>
                        <td class="text-end align-middle">
                            <a th:href="@{/events/{id}(id=${event.id})}" class="btn btn-sm btn-outline-secondary">Details</a>
                            
                            <a th:if="${event.status.name() == 'DRAFT'}" 
                               th:href="@{/events/{id}/edit(id=${event.id})}" 
                               class="btn btn-sm btn-primary ms-1">Edit</a>
                               
                            <a th:if="${event.status.name() == 'PUBLISHED' && event.startAt.isAfter(@appClock.now())}" 
                               th:href="@{/events/{id}/edit-published(id=${event.id})}" 
                               class="btn btn-sm btn-primary ms-1">Edit</a>
                               
                            <a th:if="${event.status.name() == 'IN_PROGRESS' || event.status.name() == 'AWAITING_PROOF'}" 
                               th:href="@{/events/{id}/attendance(id=${event.id})}" 
                               class="btn btn-sm btn-primary ms-1">Attendance</a>
                               
                            <form th:if="${event.status.name() == 'DRAFT'}" 
                                  th:action="@{/events/{id}/publish(id=${event.id})}" 
                                  method="post" class="d-inline ms-1">
                                <button type="submit" class="btn btn-sm btn-success">Publish</button>
                            </form>

                            <a th:if="${(event.status.name() == 'PUBLISHED' || event.status.name() == 'IN_PROGRESS') && event.endAt.isAfter(@appClock.now())}" 
                               th:href="@{/events/{id}/cancel(id=${event.id})}" 
                               class="btn btn-sm btn-danger ms-1">Cancel</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(events)}">
                        <td colspan="5" class="text-center text-muted py-4">You have not created any events yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
