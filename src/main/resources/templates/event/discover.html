<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Discover Events - impACT')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mb-5">
    <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>
    
    <div class="row mb-4">
        <div class="col">
            <h2>Discover Events</h2>
            <p class="text-muted">Find and join volunteering opportunities.</p>
        </div>
    </div>

    <!-- Search/Filter Form -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/discover}" method="get" class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label small text-muted mb-0">Search</label>
                    <input type="text" class="form-control" name="keyword" placeholder="Title or purpose..." th:value="${keyword}">
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted mb-0">Category</label>
                    <select class="form-select" name="category">
                        <option value="">All</option>
                        <option th:each="cat : ${categories}" th:value="${cat.name()}" th:text="${cat.displayName}" th:selected="${category != null and category.name() == cat.name()}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted mb-0">City</label>
                    <input type="text" class="form-control" name="city" placeholder="City..." th:value="${city}">
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted mb-0">From Date</label>
                    <input type="date" class="form-control" name="startFrom" th:value="${startFrom}">
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted mb-0">To Date</label>
                    <input type="date" class="form-control" name="startTo" th:value="${startTo}">
                </div>
                <div class="col-md-1 d-grid">
                    <button type="submit" class="btn btn-primary">Search</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Event List -->
    <div class="row">
        <div th:if="${#lists.isEmpty(events)}" class="col-12">
            <div class="alert alert-info text-center py-5">
                <h5>No events found.</h5>
                <p class="mb-0">Try adjusting your filters or search keywords.</p>
            </div>
        </div>

        <div class="col-md-4 mb-4" th:each="event : ${events}">
            <div class="card h-100 shadow-sm">
                <div class="card-header bg-white d-flex justify-content-between align-items-center">
                    <span class="badge bg-primary" th:text="${event.category.displayName}">Category</span>
                    <div class="d-flex gap-2">
                        <span th:if="${seatsLeftMap.get(event.id) <= 0}" class="badge bg-danger">Full</span>
                        <div th:replace="~{fragments/layout :: eventStatus(event=${event})}"></div>
                    </div>
                </div>
                <div class="card-body">
                    <h5 class="card-title text-truncate" th:text="${event.title}">Event Title</h5>
                    <p class="text-muted small mb-2"><i class="bi bi-geo-alt"></i> <span th:text="${event.city}">City</span></p>
                    <p class="text-muted small mb-3"><i class="bi bi-calendar"></i> <span th:text="${#temporals.format(event.startAt, 'dd MMM yyyy, HH:mm')}">Date</span></p>
                    <p class="card-text small text-muted text-truncate" th:text="${event.purpose}">Purpose preview...</p>
                </div>
                <div class="card-footer bg-white border-top-0 d-flex justify-content-between align-items-center">
                    <small th:class="${seatsLeftMap.get(event.id) <= 0 ? 'text-danger fw-bold' : 'text-muted'}">
                        <span th:text="${seatsLeftMap.get(event.id)}">0</span> seats left
                    </small>
                    <a th:href="@{/events/{id}(id=${event.id})}" class="btn btn-sm btn-outline-primary">View Details</a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
