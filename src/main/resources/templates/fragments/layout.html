<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="header(title)">
    <meta charset="UTF-8">
    <title th:text="${title}">impACT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<!-- Navbar Fragment -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/}">impACT</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/discover}">Discover</a>
                </li>
                
                <th:block th:if="${currentUser != null}">
                    <li class="nav-item" th:if="${currentUser.user.role.name() == 'ROLE_VOLUNTEER'}">
                        <a class="nav-link" th:href="@{/volunteer/dashboard}">Dashboard</a>
                    </li>
                    <li class="nav-item" th:if="${currentUser.user.role.name() == 'ROLE_ORG_MANAGER'}">
                        <a class="nav-link" th:href="@{/manager/dashboard}">Workspace</a>
                    </li>
                    <li class="nav-item" th:if="${currentUser.user.role.name() == 'ROLE_ADMIN'}">
                        <a class="nav-link" th:href="@{/admin/dashboard}">Admin Panel</a>
                    </li>
                    <li class="nav-item" th:if="${currentUser.user.role.name() == 'ROLE_VOLUNTEER' || currentUser.user.role.name() == 'ROLE_ORG_MANAGER'}">
                        <a class="nav-link" th:href="@{/my-events}">My Events</a>
                    </li>
                    <li class="nav-item" th:if="${currentUser.user.role.name() == 'ROLE_VOLUNTEER' || currentUser.user.role.name() == 'ROLE_ORG_MANAGER'}">
                        <a class="nav-link" th:href="@{/my-registrations}">My Registrations</a>
                    </li>
                    <li class="nav-item" th:if="${currentUser.user.role.name() == 'ROLE_VOLUNTEER' || currentUser.user.role.name() == 'ROLE_ORG_MANAGER'}">
                        <a class="nav-link" th:href="@{/events/create}">Create Event</a>
                    </li>
                </th:block>
            </ul>
            
            <ul class="navbar-nav align-items-lg-center" th:if="${currentUser != null}">
                <li class="nav-item me-3">
                    <a class="nav-link position-relative" th:href="@{/notifications}">
                        Notifications
                        <span th:if="${unreadNotificationCount > 0}" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                            <span th:text="${unreadNotificationCount}"></span>
                        </span>
                    </a>
                </li>
                <li class="nav-item me-3">
                    <span class="navbar-text text-white fw-bold me-2" th:text="${currentUser.user.name}">User</span>
                </li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="m-0 p-0">
                        <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                    </form>
                </li>
            </ul>
            
            <ul class="navbar-nav align-items-lg-center" th:if="${currentUser == null}">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/login}">Log In</a>
                </li>
                <li class="nav-item">
                    <a class="btn btn-primary btn-sm ms-2" th:href="@{/register}">Register</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Reusable Confirmation Modal Fragment -->
<div th:fragment="confirmModal" class="modal fade" id="genericConfirmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-light">
                <h5 class="modal-title" id="genericConfirmTitle">Confirm Action</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="genericConfirmMessage">
                Are you sure you want to proceed?
            </div>
            <div class="modal-footer border-0 pt-0">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="genericConfirmBtn">Confirm</button>
            </div>
        </div>
    </div>
</div>

<!-- Dev Profile Footer Widget Fragment -->
<div th:fragment="footer" class="container mt-5 mb-5" th:if="${@environment.acceptsProfiles('dev')}">
    
    <!-- Include the Modal structure so it exists on every page using the footer -->
    <div th:replace="~{fragments/layout :: confirmModal}"></div>

    <hr>
    <div class="card border-warning">
        <div class="card-header bg-warning text-dark fw-bold d-flex justify-content-between align-items-center">
            <span>Dev Demo Tools (Simulated Environment)</span>
            <span class="badge bg-dark">Simulated Time: <span th:text="${simulatedTimeFormatted}"></span></span>
        </div>
        <div class="card-body bg-light">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <h6>Time Controls</h6>
                    <div class="d-flex gap-2 flex-wrap">
                        <form th:action="@{/demo/skip}" method="post"><input type="hidden" name="minutes" value="1"><button type="submit" class="btn btn-sm btn-outline-secondary">Skip +1 Min</button></form>
                        <form th:action="@{/demo/skip}" method="post"><input type="hidden" name="minutes" value="5"><button type="submit" class="btn btn-sm btn-outline-secondary">Skip +5 Min</button></form>
                        <form th:action="@{/demo/skip}" method="post"><input type="hidden" name="minutes" value="60"><button type="submit" class="btn btn-sm btn-outline-secondary">Skip +1 Hour</button></form>
                        <form th:action="@{/demo/tick}" method="post"><button type="submit" class="btn btn-sm btn-primary">Run Tick Now</button></form>
                        <form th:action="@{/demo/reset-clock}" method="post"><button type="submit" class="btn btn-sm btn-dark">Reset Clock</button></form>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <h6>Seed Controls</h6>
                    <form th:action="@{/demo/reset}" method="post">
                        <button type="submit" class="btn btn-sm btn-danger mb-2">Reset & Seed Demo Data</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Generic Confirm Modal Script -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const confirmModalEl = document.getElementById('genericConfirmModal');
            if (!confirmModalEl) return;
            const confirmModal = new bootstrap.Modal(confirmModalEl);
            const confirmBtn = document.getElementById('genericConfirmBtn');
            let currentForm = null;

            document.querySelectorAll('.btn-confirm').forEach(button => {
                button.addEventListener('click', function(e) {
                    e.preventDefault();
                    currentForm = this.closest('form');
                    
                    document.getElementById('genericConfirmTitle').innerText = this.getAttribute('data-confirm-title') || 'Confirm';
                    document.getElementById('genericConfirmMessage').innerText = this.getAttribute('data-confirm-message') || 'Are you sure?';
                    
                    confirmBtn.innerText = this.getAttribute('data-confirm-button') || 'Confirm';
                    
                    // Reset classes and add the requested style
                    confirmBtn.className = 'btn';
                    const style = this.getAttribute('data-confirm-style') || 'primary';
                    confirmBtn.classList.add('btn-' + style);
                    
                    confirmBtn.disabled = false;
                    confirmModal.show();
                });
            });

            confirmBtn.addEventListener('click', function() {
                if (currentForm) {
                    this.disabled = true; // Prevent double-clicks
                    currentForm.submit();
                }
            });
        });
    </script>
</div>
<!-- If dev profile is false, we still need Bootstrap and the script -->

            confirmBtn.addEventListener('click', function() {
                if (currentForm) {

                }
            });
        });

</div>

</body>
</html>
