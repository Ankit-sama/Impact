<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Manager Workspace - impACT')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>
    <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>

    <div class="row mb-4">
        <div class="col">
            <h2>Manager Workspace</h2>
            <p class="text-muted">Welcome, <span th:text="${currentUser.user.name}"></span></p>
        </div>
    </div>
    
    <div class="row">
        <!-- Organization Profile Card -->
        <div class="col-md-12 mb-4">
            <div class="card shadow-sm">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Organization Profile</h5>
                </div>
                <!-- LIVE UPDATE WRAPPER -->
                <div class="card-body live-update" id="manager-org-profile">
                    
                    <div class="mb-3">
                        <span th:if="${organization.status.name() == 'DRAFT'}" class="badge bg-secondary">Draft</span>
                        <span th:if="${organization.status.name() == 'PENDING_VERIFICATION'}" class="badge bg-warning text-dark">Pending Verification</span>
                        <span th:if="${organization.status.name() == 'VERIFIED'}" class="badge bg-success">Verified</span>
                        <span th:if="${organization.status.name() == 'REJECTED'}" class="badge bg-danger">Rejected</span>
                        <span th:if="${organization.status.name() == 'RETURNED_FOR_CORRECTION'}" class="badge bg-info text-dark">Returned for Correction</span>
                    </div>

                    <h4 th:text="${organization.name}">Org Name</h4>
                    <p><strong>Causes:</strong> <span th:text="${organization.causes ?: 'Not provided'}"></span> | <strong>City:</strong> <span th:text="${organization.city}"></span></p>
                    <p th:text="${organization.description ?: 'Not provided'}"></p>
                    
                    <div th:if="${organization.status.name() == 'PENDING_VERIFICATION'}" class="alert alert-info mt-3">
                        Awaiting admin review.
                    </div>

                    <div th:if="${organization.status.name() == 'REJECTED'}" class="alert alert-danger mt-3">
                        <strong>Admin Note:</strong> <span th:text="${organization.reviewReason}"></span><br>
                        <em>This decision is final.</em>
                    </div>

                    <div th:if="${organization.status.name() == 'RETURNED_FOR_CORRECTION'}" class="alert alert-warning mt-3">
                        <strong>Admin Note:</strong> <span th:text="${organization.reviewReason}"></span><br>
                        <em>Correction round <span th:text="${organization.correctionRounds}"></span> of 3</em>
                    </div>

                    <div class="mt-4 d-flex gap-2">
                        <a th:href="@{/organization/{id}(id=${organization.id})}" class="btn btn-outline-primary">View Public Page</a>
                        
                        <a th:if="${organization.status.name() == 'DRAFT' || organization.status.name() == 'RETURNED_FOR_CORRECTION'}" 
                           th:href="@{/manager/organization/edit}" class="btn btn-primary">Edit Profile</a>
                           
                        <form th:if="${organization.status.name() == 'DRAFT' || organization.status.name() == 'RETURNED_FOR_CORRECTION'}"
                              th:action="@{/manager/organization/submit}" method="post">
                            <button type="button" class="btn btn-success btn-confirm" 
                                    data-confirm-title="Submit your organization for verification?" 
                                    data-confirm-message="You will not be able to edit it while it is under review." 
                                    data-confirm-button="Submit" 
                                    data-confirm-style="success">Submit for Verification</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
