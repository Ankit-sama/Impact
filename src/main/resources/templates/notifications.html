<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Notifications - impACT')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="d-flex align-items-center mb-4">
                <button type="button" class="btn btn-outline-secondary btn-sm me-3" onclick="history.back()"><i class="bi bi-arrow-left"></i> Back</button>
                <h3 class="mb-0">Your Notifications</h3>
            </div>
            
            <div class="list-group shadow-sm">
                <!-- Changed to POST forms -->
                <form th:each="note : ${notifications}" 
                      th:action="@{/notifications/{id}/read(id=${note.id})}" 
                      method="post" class="m-0 p-0">
                    <button type="submit" 
                            class="list-group-item list-group-item-action d-flex justify-content-between align-items-center border-0 border-bottom"
                            th:classappend="${!note.read} ? 'list-group-item-light fw-bold' : 'text-muted'">
                        <div>
                            <span th:if="${!note.read}" class="badge bg-danger rounded-circle p-1 me-2"><span class="visually-hidden">Unread</span></span>
                            <span th:text="${note.message}">Notification message</span>
                        </div>
                        <small th:text="${#temporals.format(note.createdAt, 'dd MMM HH:mm')}">Time</small>
                    </button>
                </form>
                
                <div th:if="${#lists.isEmpty(notifications)}" class="list-group-item text-center text-muted py-4">
                    You have no notifications.
                </div>
            </div>

        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
