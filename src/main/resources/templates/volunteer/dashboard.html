<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Volunteer Dashboard - impACT')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="row mb-4">
        <div class="col">
            <h2>Welcome, <span th:text="${currentUser.user.name}"></span>!</h2>
            <p class="text-muted">Role: Volunteer | Location: <span th:text="${currentUser.user.city}"></span></p>
        </div>
    </div>
    
    <div class="row">
        <div class="col-md-12">
            <div class="card shadow-sm">
                <div class="card-body text-center py-5">
                    <h5 class="text-muted">Volunteer Dashboard Placeholder</h5>
                    <p>Upcoming registrations, hours, and certificates will appear here.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
