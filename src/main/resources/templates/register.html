<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - impACT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        function toggleOrgField() {
            var role = document.getElementById("role").value;
            var orgField = document.getElementById("orgField");
            if (role === 'ROLE_ORG_MANAGER') {
                orgField.style.display = 'block';
            } else {
                orgField.style.display = 'none';
            }
        }
    </script>
</head>
<body class="bg-light">
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="text-center mb-4">Register for impACT</h2>

            <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <form th:action="@{/register}" th:object="${registerRequest}" method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" th:field="*{name}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" th:field="*{email}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password (Min 8 chars, 1 letter, 1 digit)</label>
                            <input type="password" class="form-control" th:field="*{password}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">City</label>
                            <input type="text" class="form-control" th:field="*{city}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Role</label>
                            <select class="form-select" th:field="*{role}" id="role" onchange="toggleOrgField()">
                                <option value="ROLE_VOLUNTEER">Volunteer</option>
                                <option value="ROLE_ORG_MANAGER">Organization Manager</option>
                            </select>
                        </div>
                        <div class="mb-3" id="orgField" style="display: none;">
                            <label class="form-label">Organization Name (Required for Managers)</label>
                            <input type="text" class="form-control" th:field="*{orgName}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Profile Photo (Optional)</label>
                            <input type="file" class="form-control" th:classappend="${#fields.hasErrors('photo')} ? 'is-invalid' : ''" th:field="*{photo}" accept="image/png, image/jpeg">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('photo')}" th:errors="*{photo}"></div>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Register</button>
                    </form>
                </div>
            </div>
            <div class="text-center mt-3">
                <a th:href="@{/login}">Already have an account? Log in</a>
            </div>
        </div>
    </div>
</div>
<script>
    // Run once on load to ensure state is correct if validation failed
    window.onload = toggleOrgField;
</script>
</body>
</html>
