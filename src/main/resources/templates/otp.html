<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Verify OTP - impACT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            
            <!-- MANDATORY SIMULATION NOTICE -->
            <div class="alert alert-warning text-center fw-bold shadow-sm">
                Simulated funding for academic demonstration - no real money is collected, held, or transferred.<br>
                Simulated OTP - no SMS is sent.
            </div>

            <h3 class="text-center mb-4">Phone Verification</h3>

            <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>
            <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>

            <!-- SIMULATED OTP DISPLAY BANNER (Fallback) -->
            <div th:if="${simulatedOtp}" class="alert alert-info text-center fs-4 font-monospace">
                Your simulated OTP is: <strong th:text="${simulatedOtp}"></strong>
            </div>

            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h5 class="card-title">1. Generate OTP</h5>
                    <form th:action="@{/otp/send}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Enter your 10-digit phone number</label>
                            <input type="text" class="form-control" name="phone" th:value="${phone}" pattern="\d{10}" required>
                        </div>
                        <button type="submit" class="btn btn-secondary w-100">Send Simulated OTP</button>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">2. Verify Code</h5>
                    <form th:action="@{/otp/verify}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Enter 6-digit Code</label>
                            <input type="text" class="form-control" name="code" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Verify Account</button>
                    </form>
                </div>
            </div>
            
            <div class="text-center mt-3">
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-link">Logout</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Modal for Simulated SMS Message -->
<div th:if="${simulatedOtp}" class="modal fade" id="otpModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-light">
                <h5 class="modal-title">New Message</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body fs-5">
                impACT: your verification code is <strong class="font-monospace" th:text="${simulatedOtp}"></strong>
            </div>
            <div class="modal-footer text-muted small border-0 pt-0">
                Simulated OTP - no SMS is sent.
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:if="${simulatedOtp}">
    document.addEventListener("DOMContentLoaded", function() {
        var otpModal = new bootstrap.Modal(document.getElementById('otpModal'));
        otpModal.show();
    });
</script>
</body>
</html>
