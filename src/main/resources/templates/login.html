<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - impACT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <h2 class="text-center mb-4">Welcome to impACT</h2>

            <div th:if="${param.error}" class="alert alert-danger">
                Invalid username or password. (Or account is inactive)
            </div>
            <div th:if="${param.logout}" class="alert alert-success">
                You have been logged out.
            </div>
            <div th:if="${param.verified}" class="alert alert-success fw-bold">
                Phone verified. Please log in.
            </div>
            <div th:if="${param.resetSuccess}" class="alert alert-info">
                Demo data reset. Please log in again.
            </div>
            <div th:if="${param.resetError}" class="alert alert-danger">
                Reset failed. See the server log.
            </div>
            <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Log In</button>
                    </form>
                </div>
            </div>
            <div class="text-center mt-3">
                <a th:href="@{/register}">Don't have an account? Register here</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
