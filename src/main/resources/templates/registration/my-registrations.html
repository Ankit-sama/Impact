<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('My Registrations - impACT')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mb-5">
    <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>
    <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>

    <div class="d-flex align-items-center mb-4">
        <button type="button" class="btn btn-outline-secondary btn-sm me-3" onclick="history.back()"><i class="bi bi-arrow-left"></i> Back</button>
        <h3 class="mb-0">My Registrations</h3>
    </div>

    <!-- Upcoming Registrations -->
    <h5 class="mb-3 border-bottom pb-2">Upcoming Events</h5>
    <div class="card shadow-sm mb-5">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Event Title</th>
                        <th>Date & Time</th>
                        <th>City</th>
                        <th>Status</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="dto : ${upcomingRegistrations}">
                        <td class="align-middle fw-semibold">
                            <a th:href="@{/events/{id}(id=${dto.event.id})}" class="text-decoration-none text-dark" th:text="${dto.event.title}"></a>
                        </td>
                        <td class="align-middle" th:text="${#temporals.format(dto.event.startAt, 'dd MMM yyyy, HH:mm')}"></td>
                        <td class="align-middle" th:text="${dto.event.city}"></td>
                        <td class="align-middle">
                            <span class="badge bg-success">Confirmed</span>
                        </td>
                        <td class="text-end align-middle">
                            <form th:action="@{/events/{id}/withdraw(id=${dto.event.id})}" method="post" class="d-inline">
                                <button type="button" class="btn btn-sm btn-outline-danger btn-confirm"
                                        data-confirm-title="Withdraw from this event?" 
                                        data-confirm-message="You will lose your seat and can register again if seats are available." 
                                        data-confirm-button="Withdraw" 
                                        data-confirm-style="danger">Withdraw</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(upcomingRegistrations)}">
                        <td colspan="5" class="text-center text-muted py-4">You have no upcoming confirmed registrations.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Past or Withdrawn Registrations -->
    <h5 class="mb-3 border-bottom pb-2">Past or Withdrawn</h5>
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Event Title</th>
                        <th>Date & Time</th>
                        <th>City</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="dto : ${pastRegistrations}">
                        <td class="align-middle">
                            <a th:href="@{/events/{id}(id=${dto.event.id})}" class="text-decoration-none text-muted" th:text="${dto.event.title}"></a>
                        </td>
                        <td class="align-middle text-muted" th:text="${#temporals.format(dto.event.startAt, 'dd MMM yyyy, HH:mm')}"></td>
                        <td class="align-middle text-muted" th:text="${dto.event.city}"></td>
                        <td class="align-middle">
                            <span th:if="${dto.registration.status.name() == 'WITHDRAWN'}" class="badge bg-secondary">Withdrawn</span>
                            <span th:if="${dto.registration.status.name() == 'CONFIRMED'}" class="badge bg-dark">Past Event</span>
                            <span th:if="${dto.registration.status.name() == 'ATTENDED'}" class="badge bg-primary">Attended</span>
                            <span th:if="${dto.registration.status.name() == 'NO_SHOW'}" class="badge bg-danger">No Show</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(pastRegistrations)}">
                        <td colspan="4" class="text-center text-muted py-4">No past or withdrawn records found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
