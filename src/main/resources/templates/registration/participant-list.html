<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Participant List - impACT')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mb-5">
    
    <div class="d-flex align-items-center mb-4">
        <button type="button" class="btn btn-outline-secondary btn-sm me-3" onclick="history.back()"><i class="bi bi-arrow-left"></i> Back</button>
        <div>
            <h3 class="mb-0">Participant List</h3>
            <p class="text-muted mb-0" th:text="${event.title}">Event Title</p>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <span class="fw-bold">Confirmed Participants</span>
            <span class="badge bg-primary rounded-pill" th:text="${#lists.size(participants)}">0</span>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Participant Name</th>
                        <th>City</th>
                        <th>Registration Time</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${participants}">
                        <td class="align-middle fw-semibold" th:text="${p.user.name}">Name</td>
                        <td class="align-middle" th:text="${p.user.city ?: 'Not provided'}">City</td>
                        <td class="align-middle text-muted small" th:text="${#temporals.format(p.registration.registeredAt, 'dd MMM yyyy, HH:mm')}">Date</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(participants)}">
                        <td colspan="3" class="text-center text-muted py-4">No confirmed participants yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer bg-white text-muted small text-center">
            Contact information (email/phone) is kept private for security reasons.
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
