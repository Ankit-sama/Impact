<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Manage Attendance - impACT')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mb-5">
    <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>

    <div class="d-flex align-items-center mb-4">
        <button type="button" class="btn btn-outline-secondary btn-sm me-3" onclick="history.back()"><i class="bi bi-arrow-left"></i> Back</button>
        <div>
            <h3 class="mb-0">Manage Attendance</h3>
            <p class="text-muted mb-0" th:text="${event.title}">Event Title</p>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <span class="fw-bold">Active Registrants</span>
        </div>
        
        <form th:action="@{/events/{id}/attendance(id=${event.id})}" method="post">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="text-center" style="width: 50px;">Present</th>
                            <th>Participant Name</th>
                            <th>City</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${participants}">
                            <td class="text-center align-middle">
                                <input type="checkbox" class="form-check-input attendance-cb" name="attendedIds" 
                                       th:value="${p.registration.id}" 
                                       th:checked="${p.registration.status.name() == 'ATTENDED'}">
                            </td>
                            <td class="align-middle fw-semibold" th:text="${p.user.name}">Name</td>
                            <td class="align-middle text-muted" th:text="${p.user.city ?: 'Not provided'}">City</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(participants)}">
                            <td colspan="3" class="text-center text-muted py-4">No active participants found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <div class="card-footer bg-light d-flex justify-content-between align-items-center">
                <span class="text-muted fw-bold"><span id="presentCount" th:text="${attendedCount ?: 0}">0</span> of <span th:text="${#lists.size(participants)}">0</span> present</span>
                <button type="submit" class="btn btn-primary" th:disabled="${#lists.isEmpty(participants)}">Save attendance</button>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const checkboxes = document.querySelectorAll('.attendance-cb');
        const countSpan = document.getElementById('presentCount');

        checkboxes.forEach(cb => {
            cb.addEventListener('change', function() {
                const checkedCount = document.querySelectorAll('.attendance-cb:checked').length;
                countSpan.innerText = checkedCount;
            });
        });
    });
</script>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
